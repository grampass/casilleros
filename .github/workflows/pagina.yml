# Publica la carpeta sitio/ en GitHub Pages cada vez que se sube un cambio a main.
# Las notas (docs/) y el resto del repositorio NO se publican.
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # El panel de demostración (logistica.html) no se publica:
      # el panel real de Logística es la Google Sheet. Sigue disponible en local.
      - name: Quitar panel de demostración
        run: rm -f sitio/logistica.html sitio/js/paginas/logistica.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
